# ci.toml -- this repository's CI contract. Checked and planned by ci-lint
# (forge-ci/ci.yml). Nothing here generates YAML: it bounds what the YAML may
# do and decides what each run selects.
#
# First declaration for this repository (forge-ci/ci.yml#38). Every platform,
# runner, suite and cache family below was read off the existing workflows,
# .github/actions/ci-job and tools/ci_jobs.py. It changes no CI behaviour.
# Where the YAML and this file disagree, the YAML is right and this file is
# the bug.
schema  = 3
profile = "cpp"
linter  = "zackees/ci.yml@b93b8c4a20ce3cd476c75a278ad01a31bde2438b"   # the pin ci.yml's provenance job already checks out

# -- Platforms -----------------------------------------------------------------
# The release matrix (release.yml `build`) ships these eight triples. PR/main CI
# (ci.yml) builds linux-x64 natively, cross-builds windows-x64 on Linux and
# runs it on windows-2025, and builds windows-x64 natively.
[platforms]
linux-x64      = { target = "x86_64-unknown-linux-gnu",   runs-on = "ubuntu-24.04",     group = "linux" }
linux-arm64    = { target = "aarch64-unknown-linux-gnu",  runs-on = "ubuntu-24.04-arm", group = "linux" }
linux-x64-musl = { target = "x86_64-unknown-linux-musl",  runs-on = "ubuntu-24.04",     group = "linux" }
linux-arm64-musl = { target = "aarch64-unknown-linux-musl", runs-on = "ubuntu-24.04-arm", group = "linux" }
windows-x64    = { target = "x86_64-pc-windows-msvc",     runs-on = "windows-2025",     group = "windows" }
windows-arm64  = { target = "aarch64-pc-windows-msvc",    runs-on = "windows-11-arm",   group = "windows" }
macos-arm64    = { target = "aarch64-apple-darwin",       runs-on = "macos-14",         group = "macos" }
macos-x64      = { target = "x86_64-apple-darwin",        runs-on = "macos-14",         group = "macos" }

# -- Suites --------------------------------------------------------------------
# Every building job runs through `.github/actions/ci-job` -> tools/ci_jobs.py.
[suites]
provenance  = { run = "python tools/verify.py --root . --positive-controls", required = true }
unit        = { run = "python -m unittest discover -s tests -p test_ci_jobs.py -v", required = true }
build       = { run = "python3 tools/ci_jobs.py run ci-linux", required = true }
correctness = { run = "python tools/ci_jobs.py run deterministic-coff" }
perf        = { run = "python3 tools/ci_jobs.py run measure", kind = "bench", gating = false }

# -- Flows ---------------------------------------------------------------------
[flow.pr]
platforms = ["linux-x64", "windows-x64"]
suites    = ["provenance", "unit", "build"]

[flow.main]
extends = "pr"
cache   = "write"

[flow.release]
platforms = "all"
suites    = "all"
publish   = "github-release"

[flow.nightly]
extends  = "pr"
schedule = "daily"
suites   = ["provenance", "unit", "build", "correctness", "perf"]
cache    = "write"

[tags]

# ci.yml already runs `ci-lint reuse-check --mode shadow` on main pushes (GEN-021);
# nothing is skipped.
[reuse.default-branch]
mode          = "shadow"
workflows     = ["ci.yml"]
required-jobs = ["provenance", "build-linux", "build-linux-cross", "test-windows-cross", "build-windows"]
max-age-hours = 24

# -- Caches --------------------------------------------------------------------
# Live listing 2026-10-26: 0 entries, 0 bytes. Families are declared from the
# key builders: zackees/zccache's compile cache per cache group, the build-tree
# cache (tools/ci_build.py KEY_PREFIX), and the clang-cl archive cache.
[cache]
budget   = "9GB"
write-on = ["main", "nightly"]
never    = []
retired  = []
pr       = { mode = "none", families = [], max-per-pr = "0MB", budget = "0MB", trim = "on-close" }

[cache.family]
buildtree = { prefix = "llvm-ld-buildtree-v1-", max = "4096MB", per = "none", evict = "lru" }
clangcl   = { prefix = "clangcl-v2-",           max = "512MB",  per = "none",     evict = "lru" }

[cache.promote]
mode = "off"

[local]
runner = "native"
lanes  = []
cache  = "off"

# -- Allowlists ----------------------------------------------------------------
[allow]
actions           = ["actions/checkout", "actions/setup-python", "actions/upload-artifact", "actions/download-artifact", "actions/cache", "ilammy/msvc-dev-cmd", "zackees/zccache"]
tools             = ["python", "python3", "cmake", "ctest", "git", "gh"]
secrets           = []
platform-selector = "CMakeLists.txt"
platform-code     = ["cmake/**", "src/**"]
cache-actions     = { only-in = ".github/actions/ci-job" }
setup-soldr       = { only-in = "" }   # this repository does not use setup-soldr

[allow.workflows]
"ci.yml"                = ["pull_request", "push:main"]
"correctness.yml"       = ["pull_request", "workflow_dispatch", "schedule"]
"benchmark.yml"         = ["pull_request", "workflow_dispatch", "schedule"]
"closure-discovery.yml" = ["pull_request", "workflow_dispatch"]
"link-benchmark.yml"    = ["workflow_dispatch", "workflow_call", "schedule"]
"release.yml"           = ["push:tag", "pull_request", "workflow_dispatch", "schedule"]

[allow.permissions]
"actions: write"  = ["allocator-only", "build-linux", "build-linux-cross", "build-windows", "deterministic-coff", "plain", "pgo-instr", "pgo-opt", "corpus", "build"]
"contents: write" = ["publish-branch", "publish"]
"pages: write"    = ["deploy-pages"]
"id-token: write" = ["deploy-pages"]

[publish]
