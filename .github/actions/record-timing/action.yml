name: record-timing
description: >-
  Write one job's timing record (tools/bench_ci.py timing) and upload it as artifact
  `timing-<name>`, for the `floors` job (#50). Shared by every link-benchmark job.
inputs:
  job:
    description: job name used by tools/bench_floors.json (e.g. pgo-opt, cells:debug)
    required: true
  start:
    description: epoch seconds when the job's work started
    required: true
  warm:
    description: "true when the job was warm (exact cache hit or 0 zccache misses)"
    required: true
  detail:
    description: free-form note shown in the floors report
    required: false
    default: ""
  zccache-stats:
    description: path to the zccache session stats JSON, if the job compiled anything
    required: false
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        JOB: ${{ inputs.job }}
        START: ${{ inputs.start }}
        WARM: ${{ inputs.warm }}
        DETAIL: ${{ inputs.detail }}
        STATS: ${{ inputs.zccache-stats }}
      run: |
        set -euo pipefail
        safe=$(echo "$JOB" | tr ':/' '--')
        extra=()
        if [ -n "$STATS" ]; then extra=(--zccache-stats "$STATS"); fi
        python3 tools/bench_ci.py timing --job "$JOB" --start "$START" --warm "$WARM" \
          --detail "$DETAIL" "${extra[@]}" --out "$RUNNER_TEMP/timing/timing-$safe.json"
        echo "SAFE_JOB=$safe" >> "$GITHUB_ENV"
    - uses: actions/upload-artifact@v4
      with:
        name: timing-${{ env.SAFE_JOB }}
        path: ${{ runner.temp }}/timing/timing-${{ env.SAFE_JOB }}.json
        retention-days: 30
