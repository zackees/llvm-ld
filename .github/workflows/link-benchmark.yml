name: link-benchmark

# Publishes the link-speed panels to the `benchmark-stats` data branch and to
# GitHub Pages. The README hotlinks the SVGs straight off that branch.
#
# Every number is a paired A/B measured in one run on one machine: the current
# linker against a baseline built from the payload as it stood before the
# link-speed patches. Only the link-speed payload files (six today) differ
# between the two, so the baseline is an incremental rebuild of a handful of
# translation units plus a relink, measured at 1.6-1.8 min on a hosted runner
# (~40 s on a 16-thread workstation), rather than a second full LLVM build.
# Hosted runners are shared and noisy, so absolute wall time compared across
# runs would publish that noise as signal; a paired ratio measured in a single
# run does not. Both binaries also have to produce byte-identical EXE and PDB
# before tests/perf/bench.py will report any timing at all.
#
# What is measured is the matrix `tests/perf/gen_corpus.py --print-matrix`
# prints: every build type in gen_corpus.MODES (Debug, Release, ThinLTO) x its
# corpora x its thread counts x both link variants (no /debug, /debug:full), so
# the chart can split each link into the link itself and the PDB's extra time.
# Non-LTO modes measure 1, 2 and 4 threads plus nproc when it is larger than
# 4; ThinLTO measures only the highest count, on `small` only, with `lto_runs`
# samples, because every ThinLTO link runs LLVM codegen. On a
# 4-core hosted runner the highest count is therefore 4, not the 16-thread
# regime behind the headline figure in CLAUDE.md.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "full (all corpora, publishes) or smoke (small corpus only, never publishes)"
        type: choice
        options: [full, smoke]
        default: full
      runs:
        description: "Paired samples per cell (>= 4)"
        type: number
        default: 9
        required: false
      lto_runs:
        description: "Paired samples per ThinLTO cell (>= 4; each link runs codegen)"
        type: number
        default: 5
        required: false
      force:
        description: "Measure even if main has not moved since the last publication"
        type: boolean
        default: false
        required: false
  # Callable from another workflow, e.g. a release pipeline that wants the
  # panels refreshed at a specific point rather than waiting for the cron.
  workflow_call:
    inputs:
      mode:
        description: "full or smoke"
        type: string
        default: full
        required: false
      runs:
        description: "Paired samples per cell (>= 4)"
        type: number
        default: 9
        required: false
      lto_runs:
        description: "Paired samples per ThinLTO cell (>= 4)"
        type: number
        default: 5
        required: false
      force:
        description: "Measure even if main has not moved since the last publication"
        type: boolean
        default: false
        required: false
  # At most once a day. The precheck job below turns a run into a no-op when
  # main has not moved since the last publication, so an idle repository costs
  # about a minute rather than a full measurement.
  schedule:
    - cron: "41 7 * * *"

# Never cancel or coalesce a publishing run: a half-finished push to the data
# branch is worse than a queued run, and runs are rare enough that queuing is
# not a concern.
concurrency:
  group: link-benchmark-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  PUBLISH_REF: refs/heads/benchmark-stats
  # The payload immediately before the link-speed patches (#14). The baseline
  # linker is this commit's version of the link-speed payload files (six today;
  # any file that does not exist at this commit is skipped with a warning).
  BASELINE_REF: f9cdd65cbfb5f64654ce428524a8126652bed8a7

jobs:
  # Cheap guard so the daily cron does nothing when there is nothing new to
  # measure. Republishing an identical measurement would only add runner noise
  # to the published numbers.
  precheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      should_run: ${{ steps.decide.outputs.should_run }}
      prior_source_sha: ${{ steps.decide.outputs.prior_source_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: decide whether there is anything to measure
        id: decide
        run: |
          set -euo pipefail
          SHOULD_RUN=true
          PRIOR_SOURCE=""
          if git ls-remote --exit-code origin "$PUBLISH_REF" >/dev/null 2>&1; then
            git fetch origin "$PUBLISH_REF" --depth=1
            # Deliberately lenient: if the prior publication cannot be read,
            # measure. Failing here would let one malformed branch block every
            # future daily run, and an extra measurement is the cheaper error.
            PRIOR_SOURCE=$(git show FETCH_HEAD:latest.json 2>/dev/null \
              | python3 -c "import json,sys; print(json.load(sys.stdin)['run']['source_sha'])" \
              2>/dev/null || true)
            if [ -n "$PRIOR_SOURCE" ] && [ "$PRIOR_SOURCE" = "${{ github.sha }}" ] \
               && [ "${{ inputs.force || false }}" != "true" ]; then
              SHOULD_RUN=false
            fi
          fi
          echo "should_run=$SHOULD_RUN" >> "$GITHUB_OUTPUT"
          echo "prior_source_sha=$PRIOR_SOURCE" >> "$GITHUB_OUTPUT"
          if [ "$SHOULD_RUN" = "false" ]; then
            echo "main has not moved since the last publication ($PRIOR_SOURCE); skipping." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

  # The jobs below replace one 2-hour serial job (#50). corpus, plain and pgo-instr start in
  # parallel; pgo-opt needs the profile; the cells matrix measures build modes in parallel;
  # measure renders; floors checks the performance floors after publication. Shared logic lives
  # in local composite actions: pgo-setup (toolchain + exact-input key + cached result),
  # zccache-build (a build under the job's own zccache, reporting warm/cold) and
  # record-timing (per-job timing for the floors).
  corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: precheck
    if: needs.precheck.outputs.should_run == 'true'
    outputs:
      key: ${{ steps.corpus_key.outputs.key }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: t0
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
      # The corpora are deterministic given the generator, the compiler and the
      # checkout path, and regenerating `large` costs 15-20 minutes on a hosted
      # runner. Cache them. clang's version is in the key because the objects
      # are its output; the path is not, because it is fixed in CI (CodeView
      # objects embed absolute source paths, so a corpus is not portable
      # between checkout locations).
      - name: corpus cache key
        id: corpus_key
        run: |
          set -euo pipefail
          MODE="${{ inputs.mode || 'full' }}"
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          SMOKE_FLAG=""
          if [ "$MODE" = "smoke" ]; then
            SMOKE_FLAG="--smoke"
          fi
          # The measurement matrix (build mode, corpus, threads, runs), from
          # the single definition in gen_corpus.MODES.
          python3 tests/perf/gen_corpus.py --print-matrix --max-threads "$(nproc)" $SMOKE_FLAG \
            --runs "${{ inputs.runs || 9 }}" --lto-runs "${{ inputs.lto_runs || 5 }}" \
            > "$RUNNER_TEMP/matrix.txt"
          echo "measurement matrix:"; cat "$RUNNER_TEMP/matrix.txt"
          GEN_HASH=$(sha256sum tests/perf/gen_corpus.py | cut -c1-16)
          CLANG_ID=$(clang --version | head -1 | tr -cd '[:alnum:].' )
          echo "key=corpus-$MODE-$GEN_HASH-$CLANG_ID" >> "$GITHUB_OUTPUT"
      - id: corpus_cache
        uses: actions/cache@v4
        with:
          path: build-perf/corpus
          key: ${{ steps.corpus_key.outputs.key }}

      - name: generate corpora
        run: |
          set -euo pipefail
          # gen_corpus.py skips any object that is already present and current,
          # so a restored cache makes this a no-op and a partial cache still
          # only rebuilds what is missing.
          awk '{print $1, $2}' "$RUNNER_TEMP/matrix.txt" | sort -u | while read -r mode profile; do
            python3 tests/perf/gen_corpus.py --out build-perf/corpus --mode "$mode" \
              --profile "$profile" --jobs "$(nproc)"
          done
          echo "corpus size: $(du -sh build-perf/corpus | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - uses: ./.github/actions/record-timing
        with:
          job: corpus
          start: ${{ steps.t0.outputs.start }}
          warm: ${{ steps.corpus_cache.outputs.cache-hit == 'true' && 'true' || 'false' }}
          detail: corpus cache ${{ steps.corpus_cache.outputs.cache-hit == 'true' && 'hit' || 'miss (generated)' }}

  # The stock-lld baseline, built plain. Normally ci.yml's build-linux has already built it for
  # this SHA; this job waits for that run instead of racing it (dispatching right after a merge
  # used to fall back silently to a cold in-job build), and says which path it took.
  plain:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: precheck
    if: needs.precheck.outputs.should_run == 'true'
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The baseline is reconstructed from history, so a shallow clone that
          # lacks BASELINE_REF would silently make this unmeasurable.
          fetch-depth: 0
          persist-credentials: false
      - id: t0
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
      - name: wait for ci.yml on this commit (up to 45 min)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            STATUS=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
              --event push --limit 1 --json status --jq '.[0].status // "none"' || echo none)
            if [ "$STATUS" != "in_progress" ] && [ "$STATUS" != "queued" ] && [ "$STATUS" != "pending" ]; then
              echo "ci.yml for $GITHUB_SHA: $STATUS"; exit 0
            fi
            echo "ci.yml for $GITHUB_SHA is $STATUS; waiting ($i/90)"; sleep 30
          done
          echo "::warning::ci.yml for $GITHUB_SHA did not finish in 45 minutes; building in-job"
      # ci.yml's build-linux job builds llvm-ld-direct plus this workflow's
      # baseline on every push to main and uploads both as
      # `llvm-ld-bench-bins-<sha>` (90-day retention), so the common path
      # compiles nothing here (#20). If no such artifact exists for
      # github.sha (e.g. ci.yml has not reached it yet, or a dispatch on a
      # non-main ref) or anything recorded in it disagrees with this
      # workflow, fall back to building in-job.
      - name: fetch prebuilt linkers from ci.yml
        id: prebuilt
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FOUND=false
          SRC_RUN=""
          NAME="llvm-ld-bench-bins-${GITHUB_SHA}"
          DL="$RUNNER_TEMP/prebuilt"
          RUN_IDS=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml \
            --commit "$GITHUB_SHA" --event push --limit 20 \
            --json databaseId --jq '.[].databaseId' || true)
          for id in $RUN_IDS; do
            rm -rf "$DL"
            if ! gh run download "$id" --repo "$GITHUB_REPOSITORY" --name "$NAME" --dir "$DL"; then
              continue
            fi
            if [ ! -f "$DL/candidate" ] || [ ! -f "$DL/baseline" ]; then
              echo "::warning::run $id's $NAME artifact is missing candidate or baseline"
              continue
            fi
            # This derivation must stay identical to the one in the baseline
            # build step below: same file, same filter, same ordering.
            EXPECT_FILES=$(python3 -c "
          import json
          d = json.load(open('provenance/payload-prune.json'))
          print(' '.join('llvm-project/' + e['path'] for e in d['patched'] if 'link-speed' in e['reason']))
          ")
            if BENCH_BINS_PATH="$DL/bench-bins.json" \
               EXPECT_SOURCE_SHA="$GITHUB_SHA" \
               EXPECT_BASELINE_REF="$BASELINE_REF" \
               EXPECT_FILES="$EXPECT_FILES" \
               EXPECT_COMPILER="$(clang --version | head -1)" \
               python3 -c "
          import json, os, sys

          path = os.environ['BENCH_BINS_PATH']
          try:
              with open(path) as f:
                  data = json.load(f)
          except (OSError, ValueError) as exc:
              print('::warning::could not read %s: %s' % (path, exc))
              sys.exit(1)

          expect_files = os.environ['EXPECT_FILES'].split()

          checks = [
              ('source_sha', data.get('source_sha'), os.environ['EXPECT_SOURCE_SHA']),
              ('baseline_ref', data.get('baseline_ref'), os.environ['EXPECT_BASELINE_REF']),
              ('files', data.get('files'), expect_files),
              ('compiler', data.get('compiler'), os.environ['EXPECT_COMPILER']),
          ]
          ok = True
          for name, got, want in checks:
              if got != want:
                  print('::warning::bench-bins.json %s mismatch: got %r, want %r' % (name, got, want))
                  ok = False
          sys.exit(0 if ok else 1)
          "; then
              # Artifacts do not preserve the executable bit, so it has to be
              # restored here.
              mkdir -p "$RUNNER_TEMP/bin"
              cp "$DL/candidate" "$RUNNER_TEMP/bin/candidate"
              cp "$DL/baseline" "$RUNNER_TEMP/bin/baseline"
              chmod +x "$RUNNER_TEMP/bin/candidate" "$RUNNER_TEMP/bin/baseline"
              FOUND=true
              SRC_RUN=$id
              break
            fi
          done
          echo "found=$FOUND" >> "$GITHUB_OUTPUT"
          if [ "$FOUND" = "true" ]; then
            echo "linkers: prebuilt by ci.yml run $SRC_RUN (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/$SRC_RUN)" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "linkers: no usable ci.yml artifact for $GITHUB_SHA; built in-job" \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: mozilla-actions/sccache-action@v0.0.11
        if: steps.prebuilt.outputs.found != 'true'
      # LLVM_APPEND_VC_REV=OFF: with it ON, LLVM stamps the git revision into
      # VCSRevision.h, so every commit changes LLVMSupport, which both defeats
      # byte-identity comparisons and poisons the compiler cache.
      # The compiler and flags here must match ci.yml's build-linux job,
      # because the common path (prebuilt found above) benchmarks that job's
      # binaries.
      - name: build the candidate linker
        if: steps.prebuilt.outputs.found != 'true'
        env:
          # Every other workflow sets this; without it sccache uses an empty
          # local disk cache, and with the compiler now aligned to ci.yml
          # (clang) the fallback can hit ci.yml build-linux's warm cache.
          SCCACHE_GHA_ENABLED: "true"
        run: |
          set -euo pipefail
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_APPEND_VC_REV=OFF \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
          cmake --build build --target llvm-ld-direct
          mkdir -p "$RUNNER_TEMP/bin"
          cp build/llvm-ld-direct "$RUNNER_TEMP/bin/candidate"

      # Rebuild the link-speed payload files at their pre-optimisation revision.
      # A file listed in the current provenance/payload-prune.json but absent at
      # BASELINE_REF is skipped with a warning (failing only if none remain), so
      # a future link-speed patch that adds a new payload file cannot break the
      # benchmark. The build tree is otherwise untouched, so this is a handful
      # of translation units and a relink.
      - name: build the baseline linker
        if: steps.prebuilt.outputs.found != 'true'
        env:
          # Every other workflow sets this; without it sccache uses an empty
          # local disk cache, and with the compiler now aligned to ci.yml
          # (clang) the fallback can hit ci.yml build-linux's warm cache.
          SCCACHE_GHA_ENABLED: "true"
        run: |
          set -euo pipefail
          CANDIDATE_FILES=$(python3 -c "
          import json
          d = json.load(open('provenance/payload-prune.json'))
          print(' '.join('llvm-project/' + e['path'] for e in d['patched'] if 'link-speed' in e['reason']))
          ")
          if [ -z "$CANDIDATE_FILES" ]; then
            echo "::error::provenance/payload-prune.json lists no link-speed payload files; the baseline cannot be reconstructed"
            exit 1
          fi
          FILES=""
          for f in $CANDIDATE_FILES; do
            if git cat-file -e "$BASELINE_REF:$f" 2>/dev/null; then
              FILES="$FILES $f"
            else
              echo "::warning::$f does not exist at $BASELINE_REF; building the baseline with the current version of that file"
            fi
          done
          FILES="${FILES# }"
          if [ -z "$FILES" ]; then
            echo "::error::none of the link-speed payload files listed in provenance/payload-prune.json exist at $BASELINE_REF; the baseline cannot be reconstructed"
            exit 1
          fi
          echo "baseline files: $FILES"
          git checkout "$BASELINE_REF" -- $FILES
          cmake --build build --target llvm-ld-direct
          cp build/llvm-ld-direct "$RUNNER_TEMP/bin/baseline"
          git checkout HEAD -- $FILES
          # The candidate was copied aside before the swap and nothing
          # downstream reads the build tree, so rebuilding the candidate here
          # was dead work (this folds in the one substantive change from
          # PR #18).

      - uses: actions/upload-artifact@v4
        with:
          name: plain-bins-${{ github.run_id }}
          path: ${{ runner.temp }}/bin/baseline
          if-no-files-found: error
          retention-days: 7
      - uses: ./.github/actions/record-timing
        with:
          job: plain
          start: ${{ steps.t0.outputs.start }}
          warm: ${{ steps.prebuilt.outputs.found == 'true' && 'true' || 'false' }}
          detail: baseline ${{ steps.prebuilt.outputs.found == 'true' && 'prebuilt by ci.yml' || 'built in-job' }}

  # PGO, stage 1: instrumented build + training -> profile. Skipped entirely when the optimized
  # binary for this exact-input key is already cached.
  pgo-instr:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    needs: precheck
    if: needs.precheck.outputs.should_run == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: t0
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
      - id: setup
        uses: ./.github/actions/pgo-setup
      - id: build
        if: steps.setup.outputs.final-hit != 'true'
        uses: ./.github/actions/zccache-build
        with:
          job: pgo-instr
          key: ${{ steps.setup.outputs.key }}
          run: |
            python3 tools/pgo_build.py instrument --launcher zccache --instr-dir "$RUNNER_TEMP/pgo-instr"
            python3 tools/pgo_build.py train --instr-dir "$RUNNER_TEMP/pgo-instr"
            python3 tools/pgo_build.py merge --instr-dir "$RUNNER_TEMP/pgo-instr"
            mkdir -p "$RUNNER_TEMP/pgo-profile"
            cp "$RUNNER_TEMP/pgo-instr/llvm-ld.profdata" "$RUNNER_TEMP/pgo-profile/"
            tar -C "$RUNNER_TEMP/pgo-instr" --exclude='*.cpp' -czf "$RUNNER_TEMP/pgo-profile/train-corpus.tar.gz" train-corpus
      - if: steps.setup.outputs.final-hit != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pgo-profile-${{ github.run_id }}
          path: ${{ runner.temp }}/pgo-profile/
          if-no-files-found: error
          retention-days: 7
      - if: always()
        uses: ./.github/actions/record-timing
        with:
          job: pgo-instr
          start: ${{ steps.t0.outputs.start }}
          warm: ${{ (steps.setup.outputs.final-hit == 'true' || steps.build.outputs.warm == 'true') && 'true' || 'false' }}
          detail: ${{ steps.setup.outputs.final-hit == 'true' && 'exact-input cache hit, skipped' || 'built and trained' }}
          zccache-stats: ${{ steps.build.outputs.stats }}

  # PGO, stage 2: -fprofile-use + ThinLTO build, then BOLT -> the published candidate. Cached
  # under the exact-input key, so a main commit that changes no C/C++ input rebuilds nothing.
  pgo-opt:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    needs: pgo-instr
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: t0
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
      - id: setup
        uses: ./.github/actions/pgo-setup
      - if: steps.setup.outputs.final-hit != 'true'
        uses: actions/download-artifact@v4
        with:
          name: pgo-profile-${{ github.run_id }}
          path: ${{ runner.temp }}/pgo-instr
      - id: build
        if: steps.setup.outputs.final-hit != 'true'
        uses: ./.github/actions/zccache-build
        with:
          job: pgo-opt
          key: ${{ steps.setup.outputs.key }}
          run: |
            tar -C "$RUNNER_TEMP/pgo-instr" -xzf "$RUNNER_TEMP/pgo-instr/train-corpus.tar.gz"
            python3 tools/pgo_build.py optimize --bolt --launcher zccache \
              --instr-dir "$RUNNER_TEMP/pgo-instr" --out-dir "$RUNNER_TEMP/pgo-out"
            python3 tools/pgo_build.py bolt --bolt-dir /usr/lib/llvm-18/bin \
              --instr-dir "$RUNNER_TEMP/pgo-instr" --out-dir "$RUNNER_TEMP/pgo-out"
            mkdir -p "$RUNNER_TEMP/pgo-final"
            cp "$RUNNER_TEMP/pgo-out/llvm-ld-direct" "$RUNNER_TEMP/pgo-instr/llvm-ld.profdata" "$RUNNER_TEMP/pgo-final/"
      - if: steps.setup.outputs.final-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/pgo-final
          key: ${{ steps.setup.outputs.key }}
      - uses: actions/upload-artifact@v4
        with:
          name: pgo-bins-${{ github.run_id }}
          path: ${{ runner.temp }}/pgo-final/llvm-ld-direct
          if-no-files-found: error
          retention-days: 7
      - name: summary
        run: |
          echo "candidate: llvm-ld-direct built with patches + PGO + ThinLTO + BOLT (key ${{ steps.setup.outputs.key }}, ${{ steps.setup.outputs.final-hit == 'true' && 'cached' || 'built' }})" >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: ./.github/actions/record-timing
        with:
          job: pgo-opt
          start: ${{ steps.t0.outputs.start }}
          warm: ${{ (steps.setup.outputs.final-hit == 'true' || steps.build.outputs.warm == 'true') && 'true' || 'false' }}
          detail: ${{ steps.setup.outputs.final-hit == 'true' && 'exact-input cache hit, skipped' || 'built with PGO + BOLT' }}
          zccache-stats: ${{ steps.build.outputs.stats }}

  # One measurement job per build mode, in parallel. Each cell is still a paired A/B on one
  # runner (candidate and baseline interleaved), so splitting across runners does not mix
  # machines inside a comparison.
  cells:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    needs: [precheck, corpus, plain, pgo-opt]
    strategy:
      fail-fast: false
      matrix:
        mode: [debug, release, thinlto]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: t0
        run: echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          name: plain-bins-${{ github.run_id }}
          path: ${{ runner.temp }}/bin
      - uses: actions/download-artifact@v4
        with:
          name: pgo-bins-${{ github.run_id }}
          path: ${{ runner.temp }}/pgo
      - name: binaries
        run: |
          set -euo pipefail
          mv "$RUNNER_TEMP/pgo/llvm-ld-direct" "$RUNNER_TEMP/bin/candidate"
          chmod +x "$RUNNER_TEMP/bin/candidate" "$RUNNER_TEMP/bin/baseline"
          # The guard in bench.py would catch this too, but failing here points at the cause.
          if cmp -s "$RUNNER_TEMP/bin/candidate" "$RUNNER_TEMP/bin/baseline"; then
            echo "::error::baseline and candidate are the same binary"; exit 1
          fi
      - uses: actions/cache/restore@v4
        with:
          path: build-perf/corpus
          key: ${{ needs.corpus.outputs.key }}
          fail-on-cache-miss: true
      - name: measure ${{ matrix.mode }}
        run: |
          set -euo pipefail
          SMOKE_FLAG=""
          if [ "${{ inputs.mode || 'full' }}" = "smoke" ]; then SMOKE_FLAG="--smoke"; fi
          mkdir -p "$RUNNER_TEMP/cells"
          python3 tests/perf/gen_corpus.py --print-matrix --max-threads "$(nproc)" $SMOKE_FLAG \
            --runs "${{ inputs.runs || 9 }}" --lto-runs "${{ inputs.lto_runs || 5 }}" \
            | awk -v m="${{ matrix.mode }}" '$1 == m' > "$RUNNER_TEMP/matrix.txt"
          {
            echo "| cell | wall-clock cost |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          while read -r mode profile threads runs variant; do
            START=$(date +%s)
            python3 tests/perf/bench.py \
              --candidate "$RUNNER_TEMP/bin/candidate" \
              --baseline "$RUNNER_TEMP/bin/baseline" \
              --corpus "build-perf/corpus/$mode/$profile" --variant "$variant" \
              --runs "$runs" --threads "$threads" \
              --json "$RUNNER_TEMP/cells/$mode-$profile-t$threads-$variant.json" < /dev/null
            echo "| $mode/$profile/t$threads/$variant | $(( $(date +%s) - START )) s |" >> "$GITHUB_STEP_SUMMARY"
          done < "$RUNNER_TEMP/matrix.txt"
          # Runner metadata of the machine that measured these cells, for the render job.
          python3 - <<'EOF'
          import json, os, platform, subprocess
          def sh(c): return subprocess.run(c, shell=True, capture_output=True, text=True).stdout.strip()
          meta = {
              "image": sh("grep '^PRETTY_NAME=' /etc/os-release | cut -d= -f2- | tr -d '\"'"),
              "cpu": sh("lscpu | grep 'Model name:' | cut -d: -f2- | xargs"),
              "cores": sh("nproc"), "kernel": sh("uname -r"), "arch": sh("uname -m"),
              "compiler": sh("clang --version | head -1"),
          }
          open(os.path.join(os.environ["RUNNER_TEMP"], "cells", "meta-${{ matrix.mode }}.json"), "w").write(json.dumps(meta))
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: cells-${{ github.run_id }}-${{ matrix.mode }}
          path: ${{ runner.temp }}/cells/
          if-no-files-found: error
          retention-days: 7
      - if: always()
        uses: ./.github/actions/record-timing
        with:
          job: cells:${{ matrix.mode }}
          start: ${{ steps.t0.outputs.start }}
          warm: "true"
          detail: measurement only

  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [precheck, cells]
    permissions:
      contents: read
    outputs:
      publish_eligible: ${{ steps.eligibility.outputs.publish_eligible }}
      prior_branch_sha: ${{ steps.prior.outputs.prior_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: mode
        run: echo "MODE=${{ inputs.mode || 'full' }}" >> "$GITHUB_ENV"
      # The site shows only the current run, so nothing is read from the prior
      # publication; its commit is recorded for publish-branch's
      # --force-with-lease.
      - name: resolve prior publication
        id: prior
        run: |
          set -euo pipefail
          if git ls-remote --exit-code origin "$PUBLISH_REF" >/dev/null 2>&1; then
            PRIOR_SHA=$(git ls-remote origin "$PUBLISH_REF" | awk '{print $1}')
            echo "prior_sha=$PRIOR_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "prior_sha=first-publication" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: cells-${{ github.run_id }}-*
          path: ${{ runner.temp }}/cells
          merge-multiple: true
      # The cells were measured on up to three runners; the chart names every CPU involved.
      - name: runner metadata
        id: meta
        run: |
          set -euo pipefail
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import glob, json, os
          metas = [json.load(open(p)) for p in sorted(glob.glob(os.path.join(os.environ["RUNNER_TEMP"], "cells", "meta-*.json")))]
          for key in ("image", "cpu", "cores", "kernel", "arch", "compiler"):
              values = []
              for m in metas:
                  if m[key] not in values:
                      values.append(m[key])
              print(f"{key}={' / '.join(values)}")
          EOF
          rm -f "$RUNNER_TEMP"/cells/meta-*.json
      - name: render site
        run: |
          set -euo pipefail
          python3 tools/bench_report.py render \
            --cells-dir "$RUNNER_TEMP/cells" \
            --output-dir "$RUNNER_TEMP/site" \
            --detached-digest-out "$RUNNER_TEMP/manifest.sha256" \
            --baseline-ref "$BASELINE_REF" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --source-sha "${{ github.sha }}" \
            --actions-run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --runner-image "${{ steps.meta.outputs.image }}" \
            --runner-cpu "${{ steps.meta.outputs.cpu }}" \
            --runner-cores "${{ steps.meta.outputs.cores }}" \
            --runner-kernel "${{ steps.meta.outputs.kernel }}" \
            --runner-arch "${{ steps.meta.outputs.arch }}" \
            --runner-compiler "${{ steps.meta.outputs.compiler }}"

      - name: publication eligibility
        id: eligibility
        run: |
          ELIGIBLE=false
          if [ "${{ github.repository }}" = "zackees/llvm-ld" ] && \
             [ "${{ github.ref }}" = "refs/heads/main" ] && \
             [ "$MODE" = "full" ]; then
            ELIGIBLE=true
          fi
          echo "publish_eligible=$ELIGIBLE" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: link-benchmark-site-${{ github.run_id }}
          path: ${{ runner.temp }}/site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: link-benchmark-cells-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/cells/
            ${{ runner.temp }}/manifest.sha256
          if-no-files-found: ignore
          retention-days: 30

  # Re-validate the uploaded artifact in a clean job, so the artifact and the
  # push are checked independently of the job that produced them.
  audit-artifact:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: measure
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: link-benchmark-site-${{ github.run_id }}
          path: audit/site/
      - run: python3 tools/bench_report.py validate-site --site-dir audit/site/

  publish-branch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [measure, audit-artifact]
    if: needs.measure.outputs.publish_eligible == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: link-benchmark-site-${{ github.run_id }}
          path: site-temp/
      - name: push benchmark-stats
        run: |
          set -euo pipefail
          python3 tools/bench_report.py validate-site --site-dir site-temp/
          MANIFEST_DIGEST=$(sha256sum site-temp/manifest.json | awk '{print $1}')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          WORKTREE=$(mktemp -d)
          git worktree add --detach "$WORKTREE" HEAD
          python3 tools/bench_report.py prepare-branch \
            --worktree "$WORKTREE" --site-dir "$GITHUB_WORKSPACE/site-temp"
          cd "$WORKTREE"
          git commit -q -m "link-benchmark run=${{ github.run_id }}/${{ github.run_attempt }} src=${{ github.sha }} manifest=$MANIFEST_DIGEST"
          python3 "$GITHUB_WORKSPACE/tools/bench_report.py" validate-revision \
            --repository "$WORKTREE" --revision HEAD \
            --site-dir "$GITHUB_WORKSPACE/site-temp"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          PRIOR_SHA="${{ needs.measure.outputs.prior_branch_sha }}"
          if [ "$PRIOR_SHA" = "first-publication" ]; then
            git push origin "HEAD:$PUBLISH_REF"
          else
            # The lease is the guard against a racing publisher: if the branch
            # moved since this run read it, the push is refused.
            git push origin "HEAD:$PUBLISH_REF" \
              --force-with-lease="refs/heads/benchmark-stats:$PRIOR_SHA"
          fi
          test "$(git ls-remote origin "$PUBLISH_REF" | awk '{print $1}')" = "$(git rev-parse HEAD)"
          cd "$GITHUB_WORKSPACE"
          git worktree remove --force "$WORKTREE"

  package-pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [measure, audit-artifact, publish-branch]
    if: needs.measure.outputs.publish_eligible == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: link-benchmark-site-${{ github.run_id }}
          path: _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site/
          include-hidden-files: true

  deploy-pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [measure, audit-artifact, publish-branch, package-pages]
    if: needs.measure.outputs.publish_eligible == 'true'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment

  publication-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [measure, publish-branch, deploy-pages]
    if: needs.measure.outputs.publish_eligible == 'true'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: link-benchmark-site-${{ github.run_id }}
          path: audit/site/
      - name: audit the published branch and deployment
        run: |
          set -euo pipefail
          git fetch origin "$PUBLISH_REF" --depth=1
          python3 tools/bench_report.py validate-revision \
            --repository . --revision FETCH_HEAD --site-dir audit/site/
          python3 tools/bench_report.py audit-pages \
            --site-dir audit/site/ \
            --page-url "${{ needs.deploy-pages.outputs.page_url }}"
          {
            echo "## Link benchmark published"
            echo "- Pages: ${{ needs.deploy-pages.outputs.page_url }}"
            echo "- Run: ${{ github.run_id }}/${{ github.run_attempt }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # Performance floors (#50, tools/bench_floors.json). Runs last and after publication, so a
  # violation fails the workflow without stopping the charts from updating. CI-time floors
  # apply only when every build job was warm (exact-input cache hit or 0 zccache misses);
  # link-speed and noisy-cell floors apply to every run.
  floors:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [precheck, corpus, plain, pgo-instr, pgo-opt, cells, measure, audit-artifact, publish-branch, package-pages, deploy-pages, publication-audit]
    if: always() && needs.precheck.outputs.should_run == 'true' && needs.measure.result == 'success'
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: timing-*
          path: ${{ runner.temp }}/timings
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: link-benchmark-site-${{ github.run_id }}
          path: ${{ runner.temp }}/site
      - name: check the floors
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          CREATED=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq .run_started_at)
          TOTAL=$(( $(date +%s) - $(date -d "$CREATED" +%s) ))
          python3 tools/bench_ci.py floors --timings "$RUNNER_TEMP/timings" \
            --latest "$RUNNER_TEMP/site/latest.json" --total-seconds "$TOTAL"
