name: allocator-benchmark
on:
  pull_request:
  workflow_dispatch:

# One live run per workflow per ref: a new push to a branch or PR cancels the
# superseded run instead of queuing behind it in the shared account-wide runner
# pool. Runs on main get a unique group, so they are never cancelled or coalesced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  allocator-only:
    runs-on: windows-2025
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      # bench-allocator (tools/ci_jobs.py, #57): the runners and allocator probes under the shared
      # windows-msvc-release zccache; the benchmark itself runs after, outside the timed build.
      - uses: ./.github/actions/ci-job
        with:
          job: bench-allocator
      - shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          ./tests/windows_allocator_benchmark.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allocator-benchmark
          path: allocator-benchmark.json
