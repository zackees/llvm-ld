name: allocator-benchmark
# Cadence (cost): one cold MSVC build plus the benchmark is ~100 runner-minutes on windows-2025,
# and the measurement never gates (a rejected hypothesis is reported, not failed). It runs on a PR
# only when the PR touches what the allocator wiring or this benchmark is made of; every other change
# is measured by the nightly run on main (skipped by `precheck` when main has not moved since the
# last green nightly), so every main commit is still covered before a release tag. To measure any
# other branch on demand: `gh workflow run allocator-benchmark --ref <branch>`.
on:
  pull_request:
    paths:
      - .github/workflows/benchmark.yml
      - tests/windows_allocator_benchmark.ps1
      - tests/allocator_probe.c
      - tools/runner.c
      - tools/import.py
      - upstream/**
      - src/**
      - include/**
      - exports.map
      - CMakeLists.txt
      - cmake/**
  workflow_dispatch:
  schedule:
    - cron: '47 6 * * *'

# One live run per workflow per ref: a new push to a branch or PR cancels the
# superseded run instead of queuing behind it in the shared account-wide runner
# pool. Runs on main get a unique group, so they are never cancelled or coalesced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  precheck:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != schedule ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/benchmark.yml/runs?event=schedule&branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""')
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "main is still at $GITHUB_SHA, already measured by a successful nightly run - skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "main moved (${last:-no previous green nightly} -> $GITHUB_SHA) - running"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  allocator-only:
    needs: precheck
    if: needs.precheck.outputs.run == 'true'
    runs-on: windows-2025
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      # bench-allocator (tools/ci_jobs.py, #57): the runners and allocator probes under the shared
      # windows-msvc-release zccache; the benchmark itself runs after, outside the timed build.
      - uses: ./.github/actions/ci-job
        with:
          job: bench-allocator
      - shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          ./tests/windows_allocator_benchmark.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allocator-benchmark
          path: allocator-benchmark.json
