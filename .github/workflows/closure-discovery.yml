name: closure-discovery

# Derive the LLVM source closure for hosts the committed payload does not cover yet.
#
# The committed payload is exactly the files the existing (x86_64 Windows/Linux) builds read.
# aarch64 Linux and macOS hosts read a few more upstream files, host-specific headers and CMake
# modules, so their builds cannot start from it. Each leg here builds over a discovery tree (full
# upstream at the pinned commit, minus the reviewed directory prune, plus the declared patches;
# see tools/prepare_discovery_tree.py) and audits what the build actually read, exactly as ci.yml
# does. The per-host closures are merged into provenance/llvm-source-closure.json with
# tools/merge_llvm_closures.py and the payload is re-materialized from the result, so every added
# file is byte-identical upstream and nothing is edited by hand.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/closure-discovery.yml
      - tools/prepare_discovery_tree.py

permissions:
  contents: read

env:
  LLVM_SRC_URL: https://github.com/llvm/llvm-project/releases/download/llvmorg-23.1.0/llvm-project-23.1.0.src.tar.xz

jobs:
  discover:
    name: Discover ${{ matrix.triple }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { triple: aarch64-unknown-linux-gnu,  runner: ubuntu-24.04-arm, kind: linux }
          - { triple: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, kind: musl }
          - { triple: aarch64-apple-darwin,       runner: macos-14,         kind: macos, osx_arch: arm64 }
          - { triple: x86_64-apple-darwin,        runner: macos-14,         kind: macos, osx_arch: x86_64 }
    steps:
      - uses: actions/checkout@v4

      - name: Stand up the discovery tree
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL "$LLVM_SRC_URL" -o llvm-src.tar.xz
          mkdir upstream && tar -xJf llvm-src.tar.xz -C upstream --strip-components=1
          cp -a llvm-project committed-payload
          python3 tools/prepare_discovery_tree.py --upstream upstream --output llvm-project --patched-source committed-payload
          rm -rf upstream llvm-src.tar.xz

      - name: Discovery build and audit (Linux / macOS)
        if: matrix.kind != 'musl'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.kind }}" = linux ]; then sudo apt-get update && sudo apt-get install -y ninja-build; else brew install ninja; fi
          extra=()
          if [ -n "${{ matrix.osx_arch }}" ]; then extra+=("-DCMAKE_OSX_ARCHITECTURES=${{ matrix.osx_arch }}"); fi
          # audit_build.py reads CMake's codemodel reply, which configure only writes when this
          # query file already exists (as ci.yml does).
          mkdir -p build/.cmake/api/v1/query && touch build/.cmake/api/v1/query/codemodel-v2
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLLVM_APPEND_VC_REV=OFF \
            -DLLVM_LD_ENABLE_PPROF=OFF -DLLVM_LD_ENABLE_DHAT=OFF "${extra[@]}" \
            --trace-expand --trace-format=json-v1 --trace-redirect=cmake-trace.jsonl
          cmake --build build --target llvm_ld llvm-ld-runner abi_smoke
          ninja -C build -t inputs llvm_ld > build-inputs.txt
          ninja -C build -t deps > build-deps.txt
          python3 tools/audit_build.py --source . --build build --ninja-inputs build-inputs.txt \
            --ninja-deps build-deps.txt --cmake-trace cmake-trace.jsonl --output closure-${{ matrix.triple }}.json

      - name: Discovery build and audit (musl)
        if: matrix.kind == 'musl'
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/src" -w /src alpine:3.20 sh -euc '
            apk add --no-cache build-base cmake python3 py3-pip linux-headers git
            # Alpine'"'"'s ninja has no `-t inputs`, which the audit needs.
            python3 -m venv /tmp/tools && /tmp/tools/bin/pip install --quiet ninja && export PATH=/tmp/tools/bin:$PATH
            mkdir -p build/.cmake/api/v1/query && touch build/.cmake/api/v1/query/codemodel-v2
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLLVM_APPEND_VC_REV=OFF \
              -DLLVM_LD_ENABLE_PPROF=OFF -DLLVM_LD_ENABLE_DHAT=OFF \
              --trace-expand --trace-format=json-v1 --trace-redirect=cmake-trace.jsonl
            cmake --build build --target llvm_ld llvm-ld-runner abi_smoke
            ninja -C build -t inputs llvm_ld > build-inputs.txt
            ninja -C build -t deps > build-deps.txt
            python3 tools/audit_build.py --source . --build build --ninja-inputs build-inputs.txt \
              --ninja-deps build-deps.txt --cmake-trace cmake-trace.jsonl --output closure-${{ matrix.triple }}.json
          '

      - uses: actions/upload-artifact@v4
        with:
          name: closure-${{ matrix.triple }}
          path: closure-${{ matrix.triple }}.json
          if-no-files-found: error
