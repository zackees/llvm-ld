name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Undeclared-read negative controls
        run: python tests/audit_negative_controls.py
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/import.py --mimalloc-only
      - run: python tools/verify.py --root . --positive-controls
      - name: Timing configuration cannot enable profiling
        run: |
          unset MIMALLOC_DHAT MIMALLOC_DHAT_DUMP_AT_EXIT MIMALLOC_PROF_ACTIVE MI_PPROF
          cmake -S . -B build-timing -DLLVM_LD_ENABLE_PPROF=OFF -DLLVM_LD_ENABLE_DHAT=OFF
          ! grep -E 'LLVM_LD_ENABLE_(PPROF|DHAT):BOOL=ON' build-timing/CMakeCache.txt
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: zackees/zccache@v1.4.0
        with:
          cache-cargo-registry: "false"
      - run: mkdir -p build/.cmake/api/v1/query && touch build/.cmake/api/v1/query/codemodel-v2
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER_LAUNCHER=zccache -DCMAKE_CXX_COMPILER_LAUNCHER=zccache -DLLVM_ENABLE_PCH=OFF --trace-expand --trace-format=json-v1 --trace-redirect=cmake-trace.jsonl
      - run: cmake --build build --target llvm_ld abi_smoke abi_contract abi_state_test allocator-probe llvm-ld-runner llvm-ld-direct
      - name: zccache stats
        if: always()
        run: zccache status || true
      - name: Audit mechanically derived build closure
        run: |
          ninja -C build -t inputs llvm_ld > build-inputs.txt
          ninja -C build -t deps > build-deps.txt
          python tools/audit_build.py --source . --build build --ninja-inputs build-inputs.txt --ninja-deps build-deps.txt --cmake-trace cmake-trace.jsonl --expected-llvm-closure provenance/llvm-source-closure.json --output source-closure.json
      - uses: actions/upload-artifact@v4
        with:
          name: linux-source-closure
          path: source-closure.json
      - name: Export allowlist
        run: |
          nm -D --defined-only --extern-only build/libllvm_ld.so | awk '{print $3}' | sort > actual-exports.txt
          printf 'llvm_ld_abi_version\nllvm_ld_allocator_get_info\nllvm_ld_invoke\nllvm_ld_profiler_start\nllvm_ld_profiler_stop\n' > expected-exports.txt
          diff -u expected-exports.txt actual-exports.txt
      - run: ctest --test-dir build --output-on-failure
      - name: zccache cleanup
        if: always()
        uses: zackees/zccache/action/cleanup@v1.4.0
  build-linux-cross:
    runs-on: ubuntu-24.04
    env:
      # TODO(#4): pin an exact clang/lld version (checksummed LLVM release tarball or a pinned
      # apt package version+revision) instead of the distro default. clang-cl/lld-link toolchain
      # drift between CI runs would silently change the cross-compiled llvm_ld.dll.
      LLVM_LD_CLANG_VERSION: "18"
      LLVM_LD_XWIN_VERSION: "0.6.5"
      # TODO(#4): pin the exact xwin --manifest source (a specific Visual Studio channel manifest
      # URL/SHA-256) and --sdk-version/--crt-version. Left as a placeholder because the pinned
      # values must be chosen and recorded in PROVENANCE.md together, not guessed here.
      LLVM_LD_XWIN_SDK_VERSION: "10.0.22621"
      LLVM_LD_XWIN_CRT_VERSION: "14.44.17.14"
      LLVM_LD_XWIN_ROOT: ${{ github.workspace }}/xwin-splat
    steps:
      - uses: actions/checkout@v4
      - uses: zackees/zccache@v1.4.0
        with:
          cache-cargo-registry: "false"
      - name: Install pinned clang/lld
        run: |
          # TODO(#4): replace with a checksum-verified download of the pinned LLVM_LD_CLANG_VERSION
          # release once that version is chosen; apt.llvm.org's install script pins the major
          # version but not a specific build's checksum.
          wget -qO- https://apt.llvm.org/llvm.sh | sudo bash -s -- "${LLVM_LD_CLANG_VERSION}"
          # clang-cl/llvm-lib/llvm-rc ship in clang-tools-N, not llvm.sh's default package set.
          sudo apt-get install -y "clang-tools-${LLVM_LD_CLANG_VERSION}" "llvm-${LLVM_LD_CLANG_VERSION}"
          sudo ln -sf "/usr/bin/clang-cl-${LLVM_LD_CLANG_VERSION}" /usr/local/bin/clang-cl
          sudo ln -sf "/usr/bin/lld-link-${LLVM_LD_CLANG_VERSION}" /usr/local/bin/lld-link
          sudo ln -sf "/usr/bin/llvm-lib-${LLVM_LD_CLANG_VERSION}" /usr/local/bin/llvm-lib
          sudo ln -sf "/usr/bin/llvm-rc-${LLVM_LD_CLANG_VERSION}" /usr/local/bin/llvm-rc
          sudo ln -sf "/usr/bin/llvm-nm-${LLVM_LD_CLANG_VERSION}" /usr/local/bin/llvm-nm
          clang-cl --version
      - name: Cache xwin splat
        id: xwin-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.LLVM_LD_XWIN_ROOT }}
          key: xwin-${{ env.LLVM_LD_XWIN_VERSION }}-sdk${{ env.LLVM_LD_XWIN_SDK_VERSION }}-crt${{ env.LLVM_LD_XWIN_CRT_VERSION }}
      - name: Provision xwin splat
        if: steps.xwin-cache.outputs.cache-hit != 'true'
        run: |
          cargo install xwin --version "${LLVM_LD_XWIN_VERSION}" --locked
          # TODO(#4): pass --manifest <pinned VS channel manifest URL/path> once that manifest and
          # its SHA-256 are chosen and recorded in PROVENANCE.md; the default manifest floats.
          xwin --accept-license \
            --sdk-version "${LLVM_LD_XWIN_SDK_VERSION}" \
            --crt-version "${LLVM_LD_XWIN_CRT_VERSION}" \
            splat --output "${LLVM_LD_XWIN_ROOT}"
      - name: Stage 1 - native llvm-tblgen / llvm-min-tblgen
        run: |
          # The pruned payload omits llvm/examples and llvm/benchmarks, and the
          # standalone llvm configure does not inherit the root CMakeLists cache
          # settings, so every LLVM_INCLUDE_* guard must be repeated here.
          cmake -S llvm-project/llvm -B build-tblgen -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_TARGETS_TO_BUILD=X86 \
            -DLLVM_ENABLE_PROJECTS="" \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_ENABLE_ZLIB=OFF -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF -DLLVM_ENABLE_TERMINFO=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=zccache -DCMAKE_CXX_COMPILER_LAUNCHER=zccache
          cmake --build build-tblgen --target llvm-tblgen llvm-min-tblgen
      - run: mkdir -p build-cross/.cmake/api/v1/query && touch build-cross/.cmake/api/v1/query/codemodel-v2
      - name: Stage 2 - cross configure
        run: |
          cmake -S . -B build-cross -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE=cmake/WinMsvcCross.cmake \
            -DLLVM_NATIVE_TOOL_DIR="${{ github.workspace }}/build-tblgen/bin" \
            -DLLVM_DISABLE_ASSEMBLY_FILES=ON \
            -DLLVM_ENABLE_PCH=OFF \
            --trace-expand --trace-format=json-v1 --trace-redirect=cmake-trace-cross.jsonl
      - run: cmake --build build-cross --target llvm_ld abi_smoke abi_contract abi_state_test allocator-probe llvm-ld-runner llvm-ld-direct
      - name: zccache stats
        if: always()
        run: zccache status || true
      - name: Audit mechanically derived build closure (cross)
        run: |
          ninja -C build-cross -t inputs llvm_ld > build-cross-inputs.txt
          ninja -C build-cross -t deps > build-cross-deps.txt
          python tools/audit_build.py --source . --build build-cross --ninja-inputs build-cross-inputs.txt --ninja-deps build-cross-deps.txt --cmake-trace cmake-trace-cross.jsonl --expected-llvm-closure provenance/llvm-source-closure.json --output source-closure-linux-cross.json
      - uses: actions/upload-artifact@v4
        with:
          name: linux-cross-source-closure
          path: source-closure-linux-cross.json
      - name: Export allowlist (llvm-nm on the import library)
        run: |
          # llvm-nm against the PE DLL's own symbol table is unreliable (PE export tables are not
          # a classic symbol table); the import library llvm-lib emits alongside llvm_ld.dll does
          # carry a symbol table listing exactly the exported names (with __imp_ twins), so that is
          # the cross equivalent of the Windows job's `dumpbin /exports`.
          llvm-nm --defined-only --extern-only build-cross/llvm_ld.lib | awk 'NF>=3{print $3}' | sed 's/^__imp_//' | sort -u > actual-exports.txt
          printf 'llvm_ld_abi_version\nllvm_ld_allocator_get_info\nllvm_ld_invoke\nllvm_ld_profiler_start\nllvm_ld_profiler_stop\n' > expected-exports.txt
          diff -u expected-exports.txt actual-exports.txt
      - name: Stage test artifacts
        run: |
          mkdir -p stage
          cp build-cross/llvm_ld.dll stage/
          cp build-cross/abi_smoke.exe build-cross/abi_contract.exe build-cross/abi_state_test.exe build-cross/allocator-probe.exe stage/
      - uses: actions/upload-artifact@v4
        with:
          name: linux-cross-stage
          path: stage
      - name: zccache cleanup
        if: always()
        uses: zackees/zccache/action/cleanup@v1.4.0
  test-windows-cross:
    needs: build-linux-cross
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/download-artifact@v4
        with:
          name: linux-cross-stage
          path: stage
      - shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python tools/verify.py --root .
          ./tools/run_staged_tests.ps1 -Stage ./stage
  build-windows:
    runs-on: windows-2025
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: mozilla-actions/sccache-action@v0.0.11
      - shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force build/.cmake/api/v1/query | Out-Null
          New-Item -ItemType File -Force build/.cmake/api/v1/query/codemodel-v2 | Out-Null
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLLVM_LD_ENABLE_PPROF=OFF -DLLVM_LD_ENABLE_DHAT=OFF -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DLLVM_ENABLE_PCH=OFF --trace-expand --trace-format=json-v1 --trace-redirect=cmake-trace.jsonl
          cmake --build build --target llvm_ld abi_smoke abi_contract abi_state_test allocator-probe llvm-ld-runner llvm-ld-direct
          ctest --test-dir build --output-on-failure
          dumpbin /nologo /exports build/llvm_ld.dll | Select-String 'llvm_ld_(abi_version|allocator_get_info|invoke|profiler_start|profiler_stop)' | ForEach-Object { if ($_ -match 'llvm_ld_[A-Za-z_]+') { $Matches[0] } } | Sort-Object -Unique | Set-Content actual-exports.txt
          @('llvm_ld_abi_version','llvm_ld_allocator_get_info','llvm_ld_invoke','llvm_ld_profiler_start','llvm_ld_profiler_stop') | Sort-Object | Set-Content expected-exports.txt
          if (Compare-Object (Get-Content expected-exports.txt) (Get-Content actual-exports.txt)) { throw 'C ABI export allowlist differs' }
          ninja -C build -t inputs llvm_ld | Set-Content build-inputs.txt
          ninja -C build -t deps | Set-Content build-deps.txt
          python tools/audit_build.py --source . --build build --ninja-inputs build-inputs.txt --ninja-deps build-deps.txt --cmake-trace cmake-trace.jsonl --expected-llvm-closure provenance/llvm-source-closure.json --output source-closure.json
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLLVM_LD_ENABLE_PPROF=ON -DLLVM_LD_ENABLE_DHAT=OFF -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DLLVM_ENABLE_PCH=OFF
          cmake --build build --target llvm_ld allocator-probe
          ./build/allocator-probe.exe mimalloc-pprof
          if($LASTEXITCODE){throw 'sampled profiler diagnostic activation failed'}
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLLVM_LD_ENABLE_PPROF=OFF -DLLVM_LD_ENABLE_DHAT=ON -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DLLVM_ENABLE_PCH=OFF
          cmake --build build --target llvm_ld allocator-probe
          ./build/allocator-probe.exe mimalloc-dhat
          if($LASTEXITCODE){throw 'DHAT diagnostic activation failed'}
      - name: sccache stats
        if: always()
        shell: pwsh
        run: sccache --show-stats
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with:
          name: windows-source-closure
          path: source-closure.json
