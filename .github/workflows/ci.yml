name: ci
on:
  pull_request:
  push:
    branches: [main]

# One live run per workflow per ref: a new push to a branch or PR cancels the
# superseded run instead of queuing behind it in the shared account-wide runner
# pool. Runs on main get a unique group, so they are never cancelled or coalesced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Undeclared-read negative controls
        run: python tests/audit_negative_controls.py
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tools/import.py --mimalloc-only
      - run: python tools/verify.py --root . --positive-controls
      # Link-speed report renderer and benchmark statistics (stdlib only, no linker needed).
      - name: bench_report.py and bench.py tests
        run: python -m unittest discover -s tests -p 'test_bench_*.py' -v
      - name: pgo_build.py tests
        run: python -m unittest discover -s tests -p 'test_pgo_build.py' -v
      - name: ci_jobs.py tests
        run: python -m unittest discover -s tests -p 'test_ci_jobs.py' -v
      - name: Timing configuration cannot enable profiling
        run: |
          unset MIMALLOC_DHAT MIMALLOC_DHAT_DUMP_AT_EXIT MIMALLOC_PROF_ACTIVE MI_PPROF
          cmake -S . -B build-timing -DLLVM_LD_ENABLE_PPROF=OFF -DLLVM_LD_ENABLE_DHAT=OFF
          ! grep -E 'LLVM_LD_ENABLE_(PPROF|DHAT):BOOL=ON' build-timing/CMakeCache.txt
  # Every building job below is the ci-job template over a job in tools/ci_jobs.py (#55, #57); the
  # YAML only installs what needs an action, calls the template and uploads artifacts.
  build-linux:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    env:
      # Must equal BASELINE_REF in .github/workflows/link-benchmark.yml. link-benchmark
      # verifies the recorded value and falls back to building in-job on any mismatch.
      BASELINE_REF: f9cdd65cbfb5f64654ce428524a8126652bed8a7
    steps:
      - uses: actions/checkout@v4
        with:
          # payload_reproducer rebuilds an upstream stand-in from the pre-strip
          # commit, which a shallow clone does not contain.
          fetch-depth: 0
      # ci-linux: the build-tree cache (#21; restored by prefix, content-verified replay), the build
      # under the shared linux-clang-release zccache, the closure audit, the export allowlist and
      # ctest. Its post phase (push to main only) builds link-benchmark's baseline linker after
      # the build tree is saved, because it leaves build/ holding BASELINE_REF objects.
      - uses: ./.github/actions/ci-job
        with:
          job: ci-linux
      - uses: actions/upload-artifact@v4
        with:
          name: linux-source-closure
          path: source-closure.json
      # Consumed by link-benchmark.yml, which looks the artifact up by this exact name for github.sha.
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: llvm-ld-bench-bins-${{ github.sha }}
          path: ${{ runner.temp }}/bench-bins/
          if-no-files-found: error
          retention-days: 90
  build-linux-cross:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    env:
      # Pinned by exact apt.llvm.org snapshot version+revision, the same package identity
      # reld's own CI validates (reld's ci.yml CLANG_PACKAGE_VERSION) -- reusing an
      # already-proven pin instead of picking a fresh, untested one. `apt-get install
      # pkg=VERSION` fails outright if this exact build is ever removed from the snapshot,
      # so this is a hard pin, not a floating major version.
      #
      # Must stay >= 19: the pinned MSVC CRT's yvals_core.h hard-errors with
      # "STL1000: Unexpected compiler version, expected Clang 19.0.0 or newer".
      LLVM_LD_CLANG_VERSION: "22.1.8"
      LLVM_LD_CLANG_APT_VERSION: "1:22.1.8~++20260714014902+ca7933e47d3a-1~exp1~20260714135019.80"
      LLVM_LD_CLANG_APT_SUITE: "llvm-toolchain-noble-22"
      LLVM_LD_CLANG_APT_PACKAGE_SERIES: "22"
      LLVM_LD_XWIN_VERSION: "0.6.5"
      # The Visual Studio channel manifest xwin resolves the SDK/CRT catalog from. Pinned to
      # a committed snapshot (provenance/vs-channel-manifest.json) instead of the live
      # `https://aka.ms/vs/17/release/channel` URL xwin fetches by default, so the SDK/CRT
      # catalog this job resolves against cannot change between CI runs. See PROVENANCE.md
      # for the fetch date, SHA-256, and update procedure.
      LLVM_LD_XWIN_MANIFEST_SHA256: "fca418ba94ffbcfb7a2b25f10f16f39dd09660568d21eef4bd3f274cb0b27b8c"
      # Matches the SDK the native build-windows job compiles against. The older 10.0.22621 ucrt
      # headers omit CRT decoration macros the vendored mimalloc amalgamation uses bare
      # (_CRT_HYBRIDPATCHABLE, _CRT_NOEXCEPT), so keeping the two paths on one SDK avoids
      # cross-only header drift. WinMsvcCross.cmake also defines those macros empty as a backstop.
      LLVM_LD_XWIN_SDK_VERSION: "10.0.26100"
      LLVM_LD_XWIN_CRT_VERSION: "14.44.17.14"
    steps:
      - uses: actions/checkout@v4
      # ci-linux-cross: installs the pinned clang-cl (key SHA-256 checked), provisions the xwin
      # splat (cached by its exact identity; the splat lives in $RUNNER_TEMP, outside the checkout,
      # so the closure audit never sees its headers as build source reads), builds native tablegen
      # and the cross tree under the linux-clangcl-cross zccache, audits the closure, checks the
      # import library's exports and stages the test binaries.
      - uses: ./.github/actions/ci-job
        with:
          job: ci-linux-cross
      - uses: actions/upload-artifact@v4
        with:
          name: linux-cross-source-closure
          path: source-closure-linux-cross.json
      - uses: actions/upload-artifact@v4
        with:
          name: linux-cross-stage
          path: stage
  test-windows-cross:
    needs: build-linux-cross
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/download-artifact@v4
        with:
          name: linux-cross-stage
          path: stage
      # verify.py checks the mimalloc payload too, and this job never configures, so nothing has
      # fetched it. Import it first, exactly as the provenance job does.
      - run: python tools/import.py --mimalloc-only
      - shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          python tools/verify.py --root .
          ./tools/run_staged_tests.ps1 -Stage ./stage
          # The cross lane is where the vendored libxml2 is most likely to break, since clang-cl
          # compiles it against the xwin sysroot rather than a real MSVC install. Prove the
          # cross-built DLL merges manifests in-process, not just that it loads.
          ./tests/windows_manifest_merge.ps1 -BuildDir ./stage
  build-windows:
    runs-on: windows-2025
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          # payload_reproducer rebuilds an upstream stand-in from the pre-strip
          # commit, which a shallow clone does not contain.
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
      # ci-windows: MSVC build under the shared windows-msvc-release zccache, ctest, dumpbin export
      # allowlist, closure audit, then the PPROF and DHAT diagnostic allocators.
      - uses: ./.github/actions/ci-job
        with:
          job: ci-windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-source-closure
          path: source-closure.json
