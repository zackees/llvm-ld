name: correctness
on:
  pull_request:
  workflow_dispatch:
jobs:
  deterministic-coff:
    runs-on: windows-2025
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Build library and pinned stock lld
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          # LLVM_APPEND_VC_REV=OFF: with it ON, LLVM stamps the git revision into the generated
          # VCSRevision.h, so every commit changes LLVMSupport and therefore llvm_ld.dll - which
          # defeats byte-identity comparisons across commits and poisons the compiler caches.
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLLVM_APPEND_VC_REV=OFF -DLLVM_LD_BUILD_SYSTEM_BASELINE=ON -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DLLVM_ENABLE_PCH=OFF
          cmake --build build --target llvm_ld llvm-ld-runner llvm-ld-runner-system llvm-ld-direct
      - name: sccache stats
        if: always()
        shell: pwsh
        run: sccache --show-stats
        continue-on-error: true
      - name: Deterministic EXE/PDB, MSVC/MinGW, LTO, and native execution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          ./tests/windows_correctness.ps1
          ./tests/windows_bridge_profile.ps1
      - name: Gold self-host link (byte-identical stock vs wrapper)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          ./tests/gold_link.ps1 -BuildDir build
      - name: In-process manifest merge (no external mt.exe)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          ./tests/windows_manifest_merge.ps1 -BuildDir build
      - name: Triage gold link failure
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Get-ChildItem gold-*.exe -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
          $pdbArgs = @()
          if ((Test-Path gold-stock-1.pdb) -and (Test-Path gold-library-1.pdb)) {
            $pdbArgs = @('--left-pdb', 'gold-stock-1.pdb', '--right-pdb', 'gold-library-1.pdb')
          }
          if ((Test-Path gold-stock-1.exe) -and (Test-Path gold-library-1.exe)) {
            python tools/pe_triage.py gold-stock-1.exe gold-library-1.exe @pdbArgs
          } else {
            Write-Host 'gold-stock-1.exe / gold-library-1.exe not present; failure likely occurred before the stock/library comparison'
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bridge-overhead-and-time-trace
          path: |
            bridge-profile.json
            lld-time-trace.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gold-link-failure-artifacts
          path: |
            gold-*.exe
            gold-*.pdb
