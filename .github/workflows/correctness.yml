name: correctness
on:
  pull_request:
  workflow_dispatch:
  # Nightly: the full job plus the Tier 2 external comparison against the release lld-link.exe
  # (issue #30). Skipped by `precheck` when main has not moved since the last green nightly.
  schedule:
    - cron: '17 6 * * *'

# One live run per workflow per ref: a new push to a branch or PR cancels the
# superseded run instead of queuing behind it in the shared account-wide runner
# pool. Runs on main get a unique group, so they are never cancelled or coalesced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  precheck:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != schedule ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/correctness.yml/runs?event=schedule&branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""')
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "main is still at $GITHUB_SHA, already validated by a successful nightly run - skipping"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "main moved (${last:-no previous green nightly} -> $GITHUB_SHA) - running"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  deterministic-coff:
    needs: precheck
    if: needs.precheck.outputs.run == 'true'
    runs-on: windows-2025
    permissions:
      contents: read
      actions: write
    env:
      # Pinned clang-cl for the LTO rows in windows_correctness.ps1 (issue #6): MSVC cl.exe cannot
      # emit LLVM bitcode, so those rows need a real clang-cl, and the runner's preinstalled one
      # floats with the image -- a newer clang-cl could emit a bitcode version the pinned LLVM
      # 23.1 LTO pipeline accepts differently, a silent correctness hazard for a byte-identity
      # gate. See PROVENANCE.md for the exact pin and update procedure.
      LLVM_LD_CLANGCL_VERSION: "23.1.0"
      LLVM_LD_CLANGCL_ARCHIVE_SHA256: "1aebf024b959b3835c3bd936da2fa58cd002c61ccf47fce1714447b900bd9837"
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      # correctness-coff (tools/ci_jobs.py, #57): the library and the pinned stock lld under the
      # shared windows-msvc-release zccache (LLVM_APPEND_VC_REV=OFF, or every commit would change
      # LLVMSupport and defeat both byte-identity and the cache), then the pinned clang-cl for the
      # LTO rows and the Tier 2 external lld-link: only clang/clang-cl, their DLLs, lib/clang and
      # lld-link.exe are extracted from the checksum-verified release archive, cached by its exact
      # identity, verified by version, and put on PATH (LLVM_LD_CLANGCL_ROOT is exported).
      - uses: ./.github/actions/ci-job
        with:
          job: correctness-coff
      - name: Deterministic EXE/PDB, MSVC/MinGW, LTO, and native execution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          ./tests/windows_correctness.ps1
          ./tests/windows_bridge_profile.ps1
      - name: Gold self-host link (byte-identical stock vs wrapper)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          ./tests/gold_link.ps1 -BuildDir build
      - name: In-process manifest merge (no external mt.exe)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          ./tests/windows_manifest_merge.ps1 -BuildDir build
      # Tier 2 corpus (issue #28): no-LTO / ThinLTO / full-LTO, stock vs wrapper, run vs run. Off
      # pull_request (nightly and workflow_dispatch) it also links with the release lld-link.exe and
      # compares against llvm-ld-direct (issue #30). Any difference there must be investigated with
      # the pe_triage.py output before an exclusion is added.
      - name: Tier 2 corpus byte-identity matrix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $tier2 = @{ BuildDir = 'build' }
          if ($env:GITHUB_EVENT_NAME -ne 'pull_request') {
            $prefix = "clang+llvm-$($env:LLVM_LD_CLANGCL_VERSION)-x86_64-pc-windows-msvc"
            $tier2.ExternalLld = "$env:LLVM_LD_CLANGCL_ROOT\$prefix\bin\lld-link.exe"
          }
          ./tests/tier2_corpus.ps1 @tier2
      - name: Triage gold link failure
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Get-ChildItem gold-*.exe -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName }
          $pdbArgs = @()
          if ((Test-Path gold-stock-1.pdb) -and (Test-Path gold-library-1.pdb)) {
            $pdbArgs = @('--left-pdb', 'gold-stock-1.pdb', '--right-pdb', 'gold-library-1.pdb')
          }
          if ((Test-Path gold-stock-1.exe) -and (Test-Path gold-library-1.exe)) {
            python tools/pe_triage.py gold-stock-1.exe gold-library-1.exe @pdbArgs
          } else {
            Write-Host 'gold-stock-1.exe / gold-library-1.exe not present; failure likely occurred before the stock/library comparison'
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bridge-overhead-and-time-trace
          path: |
            bridge-profile.json
            lld-time-trace.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: gold-link-failure-artifacts
          path: |
            gold-*.exe
            gold-*.pdb
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: tier2-failure-artifacts
          path: tier2-work/
